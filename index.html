<!doctype html>
<html lang="th">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>ผลงานวิชาการ ภาคอีสาน ครั้งที่ 30</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27%3E%3Ctext y=%27.9em%27 font-size=%2790%27%3E%F0%9F%93%8A%3C/text%3E%3C/svg%3E"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg: #f8f5fa;
        --sf: #fff;
        --ink: #1f1726;
        --mu: #665b70;
        --ln: #e9e1ee;
        --ac: #9b2c86;
        --cb: #9b2c86;
        --or: #7b5cc4;
        --po: #ec5fa8;
        --orb: #efe9fa;
        --pob: #fde8f3;
        --ort: #553a9a;
        --pot: #a1195f;
        --ob: #6a48b8;
        --pb: #c02779;
        --wb: #fff4d6;
        --wt: #7a5a00;
        box-sizing: border-box;
        padding-top: env(safe-area-inset-top, 0px);
        padding-bottom: env(safe-area-inset-bottom, 0px);
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]) {
          --bg: #150f1a;
          --sf: #201829;
          --ink: #f0e9f5;
          --mu: #b3a5c0;
          --ln: #352a40;
          --ac: #e08ad4;
          --cb: #a63a92;
          --or: #9a7de0;
          --po: #f07ab8;
          --orb: #2a2050;
          --pob: #40182f;
          --ort: #c9b8f5;
          --pot: #f7a8cf;
          --ob: #5b3fb0;
          --pb: #a8206a;
          --wb: #3a3116;
          --wt: #f0d78a;
        }
      }
      :root[data-theme="dark"] {
        --bg: #150f1a;
        --sf: #201829;
        --ink: #f0e9f5;
        --mu: #b3a5c0;
        --ln: #352a40;
        --ac: #e08ad4;
        --cb: #a63a92;
        --or: #9a7de0;
        --po: #f07ab8;
        --orb: #2a2050;
        --pob: #40182f;
        --ort: #c9b8f5;
        --pot: #f7a8cf;
        --ob: #5b3fb0;
        --pb: #a8206a;
        --wb: #3a3116;
        --wt: #f0d78a;
      }
      html {
        scroll-padding-top: env(safe-area-inset-top, 0px);
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--ink);
        font:
          400 15px/1.55 Prompt,
          Sarabun,
          system-ui,
          sans-serif;
      }
      button,
      input,
      select {
        font: inherit;
        color: inherit;
      }
      :focus-visible {
        outline: 2px solid var(--ac);
        outline-offset: 2px;
      }
      header {
        border-top: 4px solid var(--cb);
        background: var(--sf);
        border-bottom: 1px solid var(--ln);
        padding: 22px 16px 0;
        text-align: center;
      }
      h1 {
        margin: 0;
        font-size: clamp(16px, 2.6vw, 20px);
        font-weight: 500;
        line-height: 1.4;
      }
      header p {
        margin: 4px 0 0;
        color: var(--mu);
        font-size: 13px;
      }
      .brand {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 10px;
        max-width: 900px;
        margin: 0 auto;
      }
      .logo {
        height: 100px;
        width: auto;
        border-radius: 12px;
        background: #fff;
        padding: 4px;
      }
      .header .ht,
      .ht {
        text-align: center;
      }
      header p.conf {
        color: var(--ac);
        font-size: clamp(18px, 3vw, 25px);
        font-weight: 600;
        line-height: 1.4;
        margin: 0 0 8px;
      }
      @media (min-width: 760px) {
        .brand {
          flex-direction: row;
          gap: 22px;
        }
        .ht {
          text-align: left;
        }
        .logo {
          height: 112px;
        }
      }
      nav.tabs {
        display: flex;
        max-width: 760px;
        margin: 16px auto 0;
      }
      nav.tabs button {
        flex: 1;
        background: none;
        border: 0;
        border-bottom: 3px solid transparent;
        padding: 12px 6px;
        color: var(--mu);
        font-weight: 500;
        cursor: pointer;
        font-size: 14px;
      }
      nav.tabs button.on {
        color: var(--ac);
        border-color: var(--ac);
      }
      main {
        max-width: 1180px;
        margin: 0 auto;
        padding: 20px 16px 40px;
      }
      .wn {
        background: var(--wb);
        color: var(--wt);
        border-radius: 8px;
        padding: 9px 14px;
        margin-bottom: 16px;
        font-size: 13px;
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(290px, 1fr));
        gap: 16px;
      }
      .pn {
        background: var(--sf);
        border: 1px solid var(--ln);
        border-radius: 10px;
        padding: 16px;
      }
      .pn h2 {
        margin: 0 0 12px;
        font-size: 16px;
        font-weight: 500;
        text-align: center;
      }
      .dn {
        display: block;
        width: 190px;
        margin: 0 auto;
      }
      .dn text {
        fill: var(--ink);
        font-family: inherit;
      }
      .lg {
        display: flex;
        justify-content: center;
        gap: 20px;
        margin-top: 10px;
        font-size: 14px;
      }
      .lg i {
        display: inline-block;
        width: 10px;
        height: 10px;
        border-radius: 50%;
        margin-right: 6px;
      }
      .br {
        display: grid;
        grid-template-columns: minmax(90px, 132px) 1fr 34px;
        align-items: center;
        gap: 10px;
        width: 100%;
        background: none;
        border: 0;
        padding: 6px 0;
        cursor: pointer;
        text-align: left;
      }
      .br:hover .bl {
        color: var(--ac);
      }
      .bl {
        font-size: 13px;
        color: var(--mu);
        line-height: 1.3;
      }
      .bt {
        height: 22px;
        background: var(--bg);
        border-radius: 4px;
        overflow: hidden;
      }
      .bt i {
        display: block;
        height: 100%;
        border-radius: 4px;
      }
      .br b {
        font-weight: 500;
        font-size: 14px;
        text-align: right;
      }
      .cta {
        display: block;
        margin: 22px auto 0;
        background: var(--cb);
        color: #fff;
        border: 0;
        border-radius: 10px;
        padding: 11px 26px;
        font-weight: 500;
        cursor: pointer;
      }
      .bar {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        margin-bottom: 12px;
      }
      .bar input,
      .bar select {
        background: var(--sf);
        border: 1px solid var(--ln);
        border-radius: 8px;
        padding: 9px 12px;
        min-height: 42px;
      }
      .bar input {
        flex: 2 1 260px;
        min-width: 0;
      }
      .bar select {
        flex: 1 1 220px;
        min-width: 0;
        max-width: 100%;
      }
      .mu {
        color: var(--mu);
        font-size: 13px;
        margin: 8px 0;
      }
      .item {
        display: grid;
        grid-template-columns: 104px 170px 190px 1fr 190px;
        gap: 14px;
        padding: 12px 14px;
        background: var(--sf);
        border: 1px solid var(--ln);
        border-top: 0;
        align-items: start;
      }
      .item.hd {
        border-top: 1px solid var(--ln);
        border-radius: 10px 10px 0 0;
        font-weight: 500;
        background: var(--bg);
        color: var(--mu);
        font-size: 13px;
      }
      .item:last-child {
        border-radius: 0 0 10px 10px;
      }
      .tt small,
      .ty small {
        display: block;
        color: var(--mu);
        font-size: 12px;
        margin-top: 2px;
      }
      .dt {
        color: var(--mu);
        font-size: 13px;
      }
      .bd {
        font-style: normal;
        font-size: 12px;
        font-weight: 500;
        border-radius: 20px;
        padding: 2px 10px;
        display: inline-block;
      }
      .bd.oral {
        background: var(--orb);
        color: var(--ort);
      }
      .bd.poster {
        background: var(--pob);
        color: var(--pot);
      }
      .pg {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 6px;
        margin-top: 16px;
      }
      .pg button,
      .ghost {
        background: var(--sf);
        border: 1px solid var(--ln);
        border-radius: 8px;
        min-width: 40px;
        min-height: 40px;
        padding: 0 12px;
        cursor: pointer;
      }
      .pg button.on {
        background: var(--cb);
        border-color: var(--cb);
        color: #fff;
      }
      .pg button:disabled {
        opacity: 0.4;
        cursor: default;
      }
      .emp {
        background: var(--sf);
        border: 1px dashed var(--ln);
        border-radius: 10px;
        padding: 32px 16px;
        text-align: center;
        color: var(--mu);
      }
      .h {
        font-size: 17px;
        font-weight: 600;
        margin: 26px 0 10px;
        padding-left: 10px;
        border-left: 4px solid;
      }
      .h.oral {
        border-color: var(--or);
      }
      .h.poster {
        border-color: var(--po);
      }
      .gp {
        background: var(--sf);
        border: 1px solid var(--ln);
        border-radius: 10px;
        margin-bottom: 8px;
      }
      .gp summary {
        display: flex;
        justify-content: space-between;
        gap: 12px;
        padding: 12px 14px;
        cursor: pointer;
        font-weight: 500;
      }
      .gp .si {
        padding: 10px 14px;
        border-top: 1px solid var(--ln);
      }
      .si b {
        font-weight: 500;
        display: block;
      }
      .si span {
        color: var(--mu);
        font-size: 13px;
      }
      .gp .mu {
        padding: 0 14px 8px;
      }
      .bn2 {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        flex-wrap: wrap;
        color: #fff;
        border-radius: 12px;
        padding: 16px 20px;
        margin: 26px 0 12px;
      }
      .bn2:first-child {
        margin-top: 4px;
      }
      .bn2.oral {
        background: var(--ob);
      }
      .bn2.poster {
        background: var(--pb);
      }
      .bn2 h2 {
        margin: 0;
        font-size: clamp(17px, 2.6vw, 22px);
        font-weight: 600;
        line-height: 1.35;
      }
      .bn2 p {
        margin: 2px 0 0;
        font-size: 14px;
        opacity: 0.92;
      }
      .bn2 .tot {
        text-align: center;
        line-height: 1.15;
        min-width: 120px;
      }
      .bn2 .tot b {
        display: block;
        font-size: 36px;
        font-weight: 600;
      }
      .bn2 .tot span {
        font-size: 12px;
      }
      .rm {
        background: var(--sf);
        border: 1px solid var(--ln);
        border-radius: 10px;
        margin-bottom: 10px;
        overflow: hidden;
      }
      .rh {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
        padding: 11px 14px;
        font-weight: 600;
      }
      .rm.oral .rh {
        background: var(--orb);
        color: var(--ort);
      }
      .rm.poster .rh {
        background: var(--pob);
        color: var(--pot);
      }
      .rh .ct {
        flex: none;
        color: #fff;
        border-radius: 20px;
        padding: 1px 14px;
        font-size: 15px;
      }
      .rm.oral .ct {
        background: var(--ob);
      }
      .rm.poster .ct {
        background: var(--pb);
      }
      .rm .si {
        display: grid;
        grid-template-columns: 26px 1fr;
        gap: 6px;
        padding: 10px 14px;
        border-top: 1px solid var(--ln);
      }
      .no {
        font-style: normal;
        color: var(--mu);
        font-size: 13px;
        padding-top: 2px;
      }
      .rm .mu {
        padding: 0 14px;
        margin: 10px 0;
      }
      @media (max-width: 860px) {
        .item.hd {
          display: none;
        }
        .item {
          grid-template-columns: 1fr;
          gap: 4px;
          border-top: 1px solid var(--ln);
          border-radius: 10px;
          margin-bottom: 10px;
        }
        .item:last-child {
          border-radius: 10px;
        }
        .dt {
          order: -1;
        }
        .nm {
          font-weight: 500;
        }
        .og {
          color: var(--mu);
          font-size: 13px;
        }
        .ty {
          margin-top: 4px;
        }
      }
      #res {
        scroll-margin-top: 70px;
      }
      a.cta {
        width: max-content;
        text-decoration: none;
      }
      body.embed {
        background: transparent;
      }
      .embed header {
        background: transparent;
        border: 0;
        padding: 0;
      }
      .embed .brand {
        display: none;
      }
      .embed nav.tabs {
        margin-top: 0;
        border-bottom: 1px solid var(--ln);
      }
      .embed main {
        padding: 12px 0 16px;
      }
      .notabs nav.tabs {
        display: none;
      }
    </style>
  </head>
  <body>

      // วางลิงก์ Web app (ที่ลงท้ายด้วย /exec) ของ Apps Script ตรงนี้ เช่น "https://script.google.com/macros/s/xxxx/exec"
      const API_URL =
        "https://script.google.com/macros/s/AKfycby6f5oCMxiQ1PXXcfQKa_g2lNj6m3XiVtTB76BjeUXpuvVsEefOa1V0Jdw9ihyAXIes/exec";
      const REFRESH_MS = 300000; // รีเฟรชข้อมูลอัตโนมัติทุก 5 นาที (เฉพาะตอนเปิดหน้าเว็บอยู่)
      const TY = { oral: "Oral", poster: "Poster" },
        PER = 10;
      const QUOTA = { oral: 6, poster: 6 }; // จำนวนผลงานที่คัดเลือกต่อห้อง/Track แก้ตัวเลขได้ที่นี่
      // โหมดฝังในเว็บอื่น (ต่อท้ายลิงก์ /exec): ?embed=1  &tab=dash|list|sel  &tabs=0 (ซ่อนแท็บ)  &list=ลิงก์หน้ารายการ  &theme=dark
      const P = new URLSearchParams(location.search),

      if (EMBED) {

      const $ = (s) => document.querySelector(s);

      const fmt = (t) =>

      const fmtDT = (t) => {

      const ph = () => {
        try {
          if (EMBED && parent !== window)
            parent.postMessage(
              {
                esan30Height: Math.ceil(
                  document.body.getBoundingClientRect().height,

              },
              "*",

      if (EMBED && window.ResizeObserver)
        new ResizeObserver(ph).observe(document.body);

      // แปลงแถวจากชีต (หัวคอลัมน์ตามฟอร์ม) เป็นข้อมูลที่ใช้แสดงผล — ไม่นำเบอร์โทร/อีเมล/Line/ไฟล์มาเก็บ
      function norm(r) {
        const t = r["Presentation Type"] || "",
          g = r["Academic Group"] || "";
        const type = /oral|วาจา/i.test(t) ? "oral" : "poster";
        const n = +((g.match(/(?:ห้อง|กลุ่ม)ที่\s*(\d)/) || [])[1] || 0);
        const [d, m, rest] = (r["Submitted At"] || "").split("/"),
          [y, tm] = (rest || "").split(" ");
        let yr = +y;
        if (yr > 2400) yr -= 543;
        const hm = (tm || "0:0:0").split(":").map(Number);
        const ts =
          new Date(
            yr,
            m - 1,
            d,
            hm[0] || 0,
            hm[1] || 0,
            hm[2] || 0,
          ).getTime() || 0;
        const o = {
          ts,
          type,
          n,
          name: ((r.Prefix || "") + (r["Full Name"] || "")).trim(),
          org: r.Workplace || "",
          th: r["Title (Thai)"] || "",
          en: r["Title (English)"] || "",
          sel: /^(ใช่|yes|y|true|1|✓)$/i.test((r.Selected || "").trim()),
        };
        o.q = (o.name + " " + o.org + " " + o.th + " " + o.en).toLowerCase();
        return o;
      }

      // ข้อมูลตัวอย่าง (373 รายการ สัดส่วนตามภาพปีที่แล้ว) ใช้ระหว่างรอข้อมูลจริง

      function jsonp(url) {
        return new Promise((res, rej) => {
          const cb = "cb" + Date.now() + Math.floor(Math.random() * 1e4),
            el = document.createElement("script");
          const t = setTimeout(() => {
            done();
            rej(new Error("หมดเวลารอข้อมูล"));
          }, 15000);
          function done() {
            clearTimeout(t);
            delete window[cb];
            el.remove();
          }
          window[cb] = (d) => {
            done();
            res(d);
          };
          el.onerror = () => {
            done();
            rej(new Error("เชื่อมต่อไม่ได้"));
          };
          el.src = url + "&callback=" + cb;
          document.head.appendChild(el);
        });
      }
      function fetchRows() {
        const url =
          API_URL + (API_URL.includes("?") ? "&" : "?") + "action=data";
        return fetch(url)
          .then((r) => {
            if (!r.ok) throw new Error("HTTP " + r.status);
            return r.json();
          })
          .catch(() => jsonp(url))
          .then((d) => {
            if (!d || !d.ok)
              throw new Error((d && d.error) || "ข้อมูลไม่ถูกต้อง");
            return d.rows.map(norm).sort((a, b) => b.ts - a.ts);
          });
      }
      function load() {
        if (P.get("demo") == "1" || !API_URL) {
          note =

          D = sample()

          render();
          return;
        }
        $("#v").innerHTML = '<div class="emp">กำลังโหลดข้อมูล...</div>';

            note = "";

 <section class="pn"><h2>ประเภทที่ 1 นำเสนอแบบบรรยาย<br>(Oral Presentation)</h2>${bars("oral", "or")}</section>
 <section class="pn"><h2>ประเภทที่ 2 นำเสนอด้วยโปสเตอร์<br>(Poster Presentation)</h2>${bars("poster", "po")}</section></div>
 ${/^(https?:\/\/|\/(?!\/))/.test(LIST_URL) ? `<a class="cta" href="${esc(LIST_URL)}" target="_top">ดูรายชื่อผลงานทั้งหมด</a>` : `<button class="cta" data-tab="list">ดูรายชื่อผลงานทั้งหมด</button>`}`;

        const pg = Math.max(1, Math.ceil(L.length / PER));

        const a = L.slice((S.page - 1) * PER, S.page * PER),

                  return (

          ? `ข้อมูลล่าสุด ${fmtDT(lastFetch)}`
          : "";
        $("#bn").innerHTML = note ? `<div class="wn">${esc(note)}</div>` : "";
        $("#v").innerHTML =
          S.tab == "dash" ? dash() : S.tab == "list" ? list() : sel();
        if (S.tab == "list") res();
        ph();
      }

      document.addEventListener("click", (e) => {
        const b = e.target.closest("[data-tab],[data-go],[data-pg],[data-clr]");
        if (!b) return;
        const d = b.dataset;
        if (d.pg) {
          S.page = +d.pg;
          res();
          $("#res").scrollIntoView();
          return;
        }
        if (d.tab) S.tab = d.tab;
        if (d.go) {
          S.f = d.go;
          S.q = "";
          S.page = 1;
          S.tab = "list";
        }
        if (d.clr) {
          S.f = "";
          S.q = "";
          S.page = 1;
        }
        render();
        window.scrollTo(0, 0);
      });
      document.addEventListener("input", (e) => {
        if (e.target.id == "q") {
          S.q = e.target.value;
          S.page = 1;
          res();
        }
      });
      document.addEventListener("change", (e) => {
        if (e.target.id == "f") {
          S.f = e.target.value;
          S.page = 1;
          res();
        }
      });
      load();
    </script>
  </body>
</html>
